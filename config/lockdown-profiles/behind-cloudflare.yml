# Lockdown profile: behind Cloudflare (or another front proxy / CDN that owns the edge).
#
# Assumes: the front proxy terminates TLS with its own certificates and the DNS zone is
# managed at the proxy's provider, so the core neither renews certificates nor serves DNS.
# So: certificates and DNS are not shown in the portal and cannot be changed through the
# API on this core.
#
# Copy the `admin.lockdown` block into this core's configuration file (override-config.yml),
# then restart the core. Lockdown is per core and is never edited through the API.
# Setup, administrator roles and claim codes stay reachable whatever the profile.
admin:
  lockdown:
    capabilities:
      certs: hidden
      dns: hidden
