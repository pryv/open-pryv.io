---
# Base layer added under `override-config.yml` when NODE_ENV=production and no
# `--config` is given (the Docker image default). Deployment-neutral values
# only: secrets, `auth.trustedApps`, the auth UI page URLs and the mail setup
# belong to each deployment's own override (see INSTALL.md).
env: production
http:
  ip: 127.0.0.1
  port: 9000
  trustedProxies: ['loopback']   # see default-config.yml
auth:
  sessionMaxAge: 1209600000
  passwordResetRequestMaxAge: 3600000
logs:
  console:
    active: true
    level: info
    colorize: false
  file:
    active: true
    level: error
    path: var-pryv/logs/api-server.errors.log
    maxFileBytes: 4096
    maxNbFiles: 20
