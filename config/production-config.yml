---
env: production
http:
  ip: 127.0.0.1
  port: 9000
storages:
  engines:
    mongodb:
      authUser: api-server
      authPassword: OVERRIDE ME
      host: 127.0.0.1
      port: 27017
      name: pryv-node
    filesystem:
      # Attachments co-locate under the user local directory
      # (storages:engines:sqlite:path); no separate attachments directory.
      previewsDirPath: "${PRYV_DATADIR}/service-core-files/previews"
register:
  secret: OVERRIDE ME
auth:
  adminAccessKey: OVERRIDE ME
  trustedApps: "*@https://*.pryv.me*, *@http://pryv.github.io"
  sessionMaxAge: 1209600000
  ssoCookieDomain: ".pryv.io"
  ssoCookieSignSecret: OVERRIDE ME
  filesReadTokenSecret: OVERRIDE ME
  passwordResetRequestMaxAge: 3600000
  passwordResetPageURL: https://sw.pryv.me/access/reset-password.html
  emailVerificationPageURL: https://sw.pryv.me/access/verify-email.html
# Third-party sign-in (OIDC relying party). Disabled by default; uncomment and
# fill in to enable. `clientSecret` is a per-core secret — keep it YAML-only.
# sso:
#   enabled: true
#   landingPageURL: https://sw.pryv.me/access/sso-signin.html
#   providers:
#     google:
#       issuer: https://accounts.google.com
#       clientId: OVERRIDE ME
#       clientSecret: OVERRIDE ME
#       label: Google
services:
  register:
    url: https://reg.pryv.io
  email:
    welcomeTemplate: welcome-email
    resetPasswordTemplate: reset-password
    verifyEmailTemplate: verify-email
    method: mandrill
    url: https://mandrillapp.com/api/1.0/messages/send-template.json
    key: OVERRIDE ME
logs:
  console:
    active: true
    level: info
    colorize: false
  file:
    active: true
    level: error
    path: "${PRYV_LOGSDIR}/api-server.errors.log"
    maxFileBytes: 4096
    maxNbFiles: 20
