---
logs:
  console:
    active: true
    level: info
  file:
    active: true
    path: "var-pryv/logs/core.log"
    level: info
    rotation:
      isActive: true
      days: 14
auth:
  adminAccessKey: dev-only-admin-access-key
  # Public values so a stock checkout boots under NODE_ENV=development: the
  # default-config value is a `REPLACE ME` sentinel and the key is required
  # unconditionally, so without this the master exits 1 during validation.
  # Never use these values outside local development.
  filesReadTokenSecret: dev-only-files-read-token-secret
  trustedApps: "*@https://pryv.github.io*, *@https://*.rec.la*, *@https://*.backloop.dev*, *@http://127.0.0.1*"
platform:
  # Public value so a stock checkout can register users under
  # NODE_ENV=development (PII is hashed by default and the key is required at
  # boot). Same value as the test harness (scripts/components-run), so dev and
  # test runs sharing a local PlatformDB hash alike. Never use it outside local
  # development.
  piiHmacKey: 'WLthDQK7GoYZINg7uIeWN9eANnj2BSh4zEZmRPyR5y0='
serviceInfoUrl: file://test/service-info.json
services:
  email:
    enabled:
      welcome: false
      resetPassword: false
  register:
    url: http://127.0.0.1:8080
    key: test-system-key
reporting:
  templateVersion: 1.0.0
testNotifications:
  enabled: false
dnsLess:
  isActive: true
  publicUrl: http://127.0.0.1:3000/
# Local multi-core setups run their cores on http://127.0.0.1.
cluster:
  allowInsecurePeerUrl: true
custom:
  systemStreams:
    account:
      -
        isIndexed: true
        isUnique: true
        isShown: true
        isEditable: true
        type: email/string
        name: Email
        id: email
        isRequiredInValidation: true
    other:
      -
        isShown: true
        isEditable: true
        type: my-custom-stream/string
        name: myCustomStream
        id: myCustomStream
user-account:
  delete: # array of entities that can delete a user account
    - 'adminToken' # enable deletion from admin Panel
    - 'personalToken' # enable self deletion request with a personal token
trace:
  enable: true
