# Config overlay for running lib-js tests via HTTPS proxy.
# API server runs on HTTP :3001 (no SSL), proxy on HTTPS :3000 (backloop.dev).
# Loaded via override-config.yml mechanism (highest priority).
http:
  port: 3001

dnsLess:
  isActive: true
  publicUrl: https://l.backloop.dev:3000/

service:
  assets:
    # Served by the suite's HTTPS proxy from components/externals/test/fixtures/assets
    # (a copy of the public pryv.me assets), so the suite needs no internet access.
    definitions: https://l.backloop.dev:3000/test-assets/index.json

# Auth-popup base URL — only needs to be a well-formed URL for the
# access-request flow tests (no auth UI is actually served locally).
access:
  defaultAuthUrl: https://l.backloop.dev:3000/auth-ui/access.html

# Local-integration auth values (NOT secrets — this overlay only ever runs
# the lib-js suite against a throwaway local dev server).
auth:
  adminAccessKey: 'libjs-test-admin-key'
  filesReadTokenSecret: 'libjs-test-files-secret'
  ssoCookieSignSecret: 'libjs-test-sso-secret'
  # Email verification is on by default, so the servers this overlay configures
  # need the page URL; without it they would boot with a warning and the
  # feature off, which is harmless for these tests but noisy.
  # The servers this file configures are spawned with NODE_ENV=development, so
  # they never read test-config.yml and need their own copy: without it, an
  # opted-in server exits 1 during validation and the suite fails with an
  # opaque "Server not ready" timeout instead.
  # The URL itself is never dereferenced here; these tests mock no mail.
  emailVerificationPageURL: 'http://test.pryv.local/verify-email'
