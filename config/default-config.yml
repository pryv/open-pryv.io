---
# Unified service-core configuration
# Merged from per-component configs into a single source of truth.
#
# Configuration model — three classes:
#   - PER-CORE:      local to each node (ports, paths, workers, DB credentials)
#   - PLATFORM-WIDE: MUST be identical across cores in a deployment (policy, schema, identity)
#   - BOOTSTRAP:     platform-wide in meaning but YAML-only because needed before PlatformDB is reachable
#
# Multi-core operators: PlatformDB is authoritative for platform-wide items once seeded.
# Keys below are annotated with their category. Drift warnings are logged on startup.

# === BOOTSTRAP ===
dnsLess:
  isActive: true

reporting:
  templateVersion: '1.0.0'   # BOOTSTRAP

# === PER-CORE: network bind ===
http:
  ip: '127.0.0.1'
  port: 3000
  hfsPort: 4000
  previewsPort: 3001
  # Proxies whose X-Forwarded-For header is believed when recording the client
  # address (audit `source.ip`). IPs, CIDRs, or the names loopback, linklocal,
  # uniquelocal. The default covers a proxy on the same host and the core's own
  # HFS dispatcher. A core exposed directly keeps it: clients cannot choose
  # their recorded address. Behind a proxy on another host or a Docker bridge
  # (e.g. Dokku), list it: ['172.17.0.1'], ['loopback', '10.0.0.0/8'].
  # [] = never read the header.
  trustedProxies: ['loopback']

# === PER-CORE / BOOTSTRAP: storage engines ===
# Engine choice is per-core (flexibility for staging/migration).
# Connection strings and credentials are always per-core.
# `storages.platform.engine` + rqlite settings are BOOTSTRAP — needed before PlatformDB is reachable.
storages:
  base:
    # baseStorage + dataStore. PostgreSQL is the default; SQLite is the
    # alternative for low-volume / single-node deployments — set
    # `engine: sqlite` in override-config.yml (or `STORAGE_ENGINE=sqlite`
    # in the test harness) to pick it explicitly.
    engine: postgresql
  platform:
    # platformStorage. rqlite is the default and the only multi-core option
    # (Raft-replicated across cores). Single-core dnsLess deployments in
    # full PG mode may set `engine: postgresql` to keep platform data in
    # the same PostgreSQL instance as user data (diskless shape — no rqlite
    # process or data dir). Going multi-core later requires migrating the
    # platform data back to rqlite (`node bin/migrate-platform.js`).
    engine: rqlite
    # PER-CORE. The master re-runs the boot-time platform DB integrity check
    # (this core's copy, read-only) at this interval and logs an ERROR when it
    # fails, INFO once when it passes again. 0 disables. Default: 1 hour.
    integrityCheckIntervalMs: 3600000
  series:
    engine: postgresql      # seriesStorage. Default since 2026-05-12; raw deploys typically don't ship influxd. Set `engine: influxdb` here in override-config.yml to opt back in (requires a running influxd on http.ip:storages.engines.influxdb.port).
  file:
    engine: filesystem      # fileStorage
  audit:
    engine: sqlite          # auditStorage

  # === PLATFORM-WIDE: content-query acceleration indexes ===
  # Content/clientData query conditions on events.get are always available
  # (correct without indexes — sequential scan). Declaring paths here only
  # creates acceleration indexes for them; declare identically on every core.
  # Engines without index support (SQLite) ignore this and serve by scan.
  # Each entry: { field: content|clientData, path: <dot-path or $>, types?: [<event types>] }
  # Example:
  #   contentIndexes:
  #     - field: content
  #       path: drug.codes.atc
  #       types: ['medication/exposure-assertion-v1']
  contentIndexes: []

  engines:
    postgresql:
      host: '127.0.0.1'
      port: 5432
      database: 'pryv-node'
      user: 'pryv'
      password: ''
      max: 20
      # Audit connections are pooled separately from the ones above, and the
      # two audit pools are separate from each other: a streamed audit read
      # holds its connection for the whole response, so keeping it off the
      # write pool is what stops a slow reader delaying or dropping an audit
      # write. Raise auditReadPoolSize, not auditPoolSize, for read throughput.
      # auditPoolSize: 5      # audit writes and short reads
      # auditReadPoolSize: 5  # streamed audit reads only
    sqlite:
      path: 'REPLACE ME'
    filesystem:
      # Event file ATTACHMENTS co-locate with per-user data under the user
      # local directory (storages:engines:sqlite:path) - there is no separate
      # attachments directory. Only previews have their own directory.
      previewsDirPath: 'REPLACE ME'
    # s3 — S3-compatible attachment storage (diskless alternative to
    # filesystem; select with `storages.file.engine: s3`). Uncomment + fill:
    # s3:
    #   endpoint: https://s3.example.com   # omit for AWS (region-derived)
    #   region: us-east-1
    #   bucket: pryv-attachments
    #   accessKeyId: null                  # null = AWS credential chain / IAM
    #   secretAccessKey: null
    #   forcePathStyle: true               # required by MinIO / most self-hosted
    #   keyPrefix: ''
    influxdb:
      host: 127.0.0.1
      port: 8086
    rqlite:
      url: http://localhost:4001
      raftPort: 4002                  # Raft consensus port (common across all cores)
      httpBindAddr: null              # null = the spawned rqlited's HTTP API (port of `url`) listens on
                                      # loopback only, in single- and multi-core mode: it is unauthenticated,
                                      # and cores replicate and forward writes over the Raft port.
                                      # An address (e.g. 0.0.0.0) exposes it there; a boot warning says so.
                                      # With one specific non-loopback address, point `url` at it as well.
      dataDir: var-pryv/rqlite-data   # rqlite data directory (relative to service-core root)
      binPath: bin-ext/rqlited        # rqlited binary path (Docker: /app/bin-ext/rqlited)
      external: false                 # false = master spawns and owns the rqlited process.
                                      # true = an rqlited is already running at `url` and master
                                      # only waits for it (multi-core deployments sharing one
                                      # instance, or a separately-managed process).
      readyTimeoutMs: 30000           # how long master waits for rqlited's HTTP API (/readyz) at boot.
                                      # A boot that exceeds it fails and is retried by the supervisor;
                                      # raise it on nodes with a large platform dataset or slow disks.
                                      # Applies to the managed process and to `external: true`.
      logFile: null                   # null = the spawned rqlited writes to the master's own stdout/stderr.
                                      # A path (relative to service-core root) = rqlited appends its output
                                      # there instead (rotate with copytruncate). Never piped through the
                                      # master: rqlited must keep logging while it closes, after the master.
      # tls: null = plain TCP for Raft, single-core only (Raft on loopback).
      # A multi-core node (core.ip set) refuses to start without it: set all of
      # caFile / certFile / keyFile to PEM files on disk for mutually-authenticated
      # TLS on the Raft channel. `node bin/bootstrap.js init-ca-holder` (and the
      # bootstrap bundle of every joining core) issues and sets them.
      tls: null
      # tls:
      #   caFile:   /etc/pryv/tls/ca.crt
      #   certFile: /etc/pryv/tls/node.crt
      #   keyFile:  /etc/pryv/tls/node.key
      #   verifyClient: true           # require mTLS on incoming Raft
      #   verifyServerName: null       # override SAN/CN expected on peers (null = use hostname)

# === PER-CORE: local cache paths and schedules ===
eventFiles:
  previewsCacheMaxAge: 604800000 # 1 week in ms
  previewsCacheCleanUpCronTime: 00 00 2 * * * # every day at 2:00:00AM

# === BOOTSTRAP → PLATFORM-WIDE ===
# Seeded into PlatformDB on first boot, then PlatformDB is authoritative.
invitationTokens: null  # null = allow all, [] = block all, ['token1'] = check list

# === MIXED: per-core secrets + platform-wide policy ===
# - `filesReadTokenSecret`: PER-CORE secret (must be identical across cores for cross-core validation).
# - `passwordComplexity*`, `passwordAge*`, `passwordPreventReuseHistoryLength`: PLATFORM-WIDE policy (documented as YAML-only in v2, targeted for post-v2 move to PlatformDB).
# - `adminAccessKey`: BOOTSTRAP, operator-sync responsibility (see CONFIG-SEPARATION.md open question).
auth:
  filesReadTokenSecret: 'REPLACE ME'
  passwordComplexityMinCharCategories: 0
  passwordComplexityMinLength: 0
  passwordAgeMaxDays: 0
  passwordAgeMinDays: 0
  passwordPreventReuseHistoryLength: 0

# === Third-party sign-in (Pryv as an OpenID Connect relying party) ===
# Inert unless a provider is configured: no routes mount and no network calls
# are made.
sso:
  enabled: false                 # master kill-switch (opt-in)
  landingPageURL: ''             # auth-app page that receives the one-time
                                 # sign-in handoff (REQUIRED when enabled with
                                 # providers)
  callbackBaseURL: ''            # optional; defaults from the public service
                                 # URL. `<base>/auth/sso/<provider>/callback`
                                 # must be registered VERBATIM at each IdP.
  providers: {}                  # operator IdP allow-list, default EMPTY
  # providers:
  #   google:
  #     issuer: https://accounts.google.com
  #     clientId: ''             # from the IdP's app registration
  #     clientSecret: ''         # PER-CORE secret — YAML only, never PlatformDB
  #     label: Google            # sign-in button label

# === PER-CORE: local plugin code references ===
customExtensions:
  defaultFolder: 'REPLACE ME'
  customAuthStepFn: ''

# === PER-CORE: external service integrations ===
# SMS provider URLs and email provider credentials may legitimately vary per region/deployment.
# MFA `mode` is PLATFORM-WIDE policy — documented as YAML-only in v2, targeted for post-v2 move.
# --- Services (external integrations) ---
services:
  # Multi-factor authentication. Pluggable + multi-method. Two config models
  # coexist:
  #   NEW (preferred): `active` + `defaultMethod` + `methods.{totp,sms}`.
  #     TOTP (authenticator apps, RFC 6238) is served in-process; it is the
  #     default method when MFA is enabled.
  #   LEGACY: `mode` (disabled | challenge-verify | single) — an SMS-only
  #     selector, still honored via an in-memory shim that maps it onto
  #     methods.sms. Existing deployments need no change.
  # Category: MIXED. Method policy (active/defaultMethod/methods.*.active +
  # TOTP digits/period/drift/issuer) and the failed-attempt policy (`attempts`)
  # are PLATFORM-WIDE (identical across cores).
  # `methods.totp.secretsKey` and SMS endpoint headers are SECRET-grade:
  # YAML-only, never PlatformDB, operator-sync responsibility.
  mfa:
    mode: disabled            # LEGACY selector; when set to single|challenge-verify
                              # it TAKES PRECEDENCE (SMS-only shim) so legacy
                              # deployments upgrade byte-identically. Deprecated;
                              # remove it to adopt the multi-method model + TOTP.
    active: true              # MFA endpoints live by default; TOTP works out of
                              # the box (in-process, no external service). Users
                              # are only challenged after they enrol; nothing is
                              # forced. Set false to disable MFA entirely.
    defaultMethod: totp       # offered by mfa.activate when the body names none
    methods:
      totp:
        active: true          # effective once services.mfa.active is true
        issuer: ''            # otpauth issuer; '' => dns.domain, else 'Pryv.io'
        digits: 6
        periodSeconds: 30
        driftSteps: 1         # accept +/- N 30s steps on verify
        secretsKey: ''        # SECRET: base64 32-byte at-rest key for TOTP
                              # secrets; '' => derive from auth.adminAccessKey
      sms:
        active: false
        mode: single          # single | challenge-verify
        endpoints: {}         # same shape as the legacy `sms.endpoints` below;
                              # falls back to it when empty
        contentKeys: []       # keys an SMS enrolment (mfa.activate body) may
                              # carry besides `phone` (always required, E.164),
                              # e.g. [language]; each a string, 256 bytes in
                              # total; any other key is refused. Falls back to
                              # a legacy `sms.contentKeys` when empty.
                              # Placeholders are encoded for where they land
                              # (URL, JSON or form body; a header value with a
                              # control character is refused) and substituted
                              # once: a value is never expanded again.
        # Mode `single` (the core generates the code): digits of the code (4 to
        # 10) and how long a code is accepted. A code belongs to one pending MFA
        # session (only its hash is kept, in the session); a new challenge on
        # the session replaces it and restarts its lifetime.
        codeLength: 6
        codeTtlSeconds: 300
        # Limits on SMS sends (login challenge, mfa.challenge re-send, SMS
        # mfa.activate), both modes. A send over a limit answers 429
        # too-many-attempts with retryAfterSeconds, and nothing is sent. Each
        # limit is disabled by 0 (a boot warning says so). The destination is
        # counted by a hash of the phone number, across users.
        sendLimits:
          minIntervalSeconds: 30    # between two sends on one MFA session
          perUserPerHour: 5         # sends per user, window opened by the first
          perDestinationPerDay: 10  # sends per phone number, window opened by the first
        # The legacy mode (`mode` above) reads codeLength, codeTtlSeconds and
        # sendLimits from the legacy `sms` block below first, then from here.
    # LEGACY endpoints location, read by the shim (and by methods.sms when its
    # own `endpoints` is empty). SECRET: headers may carry provider API keys.
    sms:
      endpoints:
        challenge:
          url: ''
          method: POST
          body: ''
          headers: {}
        verify:
          url: ''
          method: POST
          body: ''
          headers: {}
          # How a provider confirms a code (challenge-verify mode), e.g.
          #   success: { jsonPath: status, equals: approved }
          # A verify then succeeds only on a 2xx JSON answer whose value at
          # `jsonPath` (dot-separated property names, e.g. data.result)
          # strictly equals `equals` (a string, number or boolean). Without
          # it, only an EMPTY 2xx answer (e.g. 204) is a success and a 2xx
          # with a body is refused; the boot warns while it is missing.
        single:
          url: ''
          method: POST
          body: ''
          headers: {}
    sessions:
      # Lifetime of a pending MFA session (between a login or an activation
      # and its verify or confirm), fixed when it is opened: attempts and
      # re-sent challenges do not extend it.
      ttlSeconds: 1800
      # Most pending MFA sessions this core holds at once (each is held in
      # memory). Past it, a login or an activation that needs one answers
      # 429 too-many-requests until sessions are completed or expire.
      # 0 disables the cap.
      maxPending: 10000
    # Failed second-factor limits. `perSession` bounds one pending MFA session
    # (the historical fixed limit). Failures also accrue per account across
    # logins, so re-authenticating does not hand out a fresh budget: after
    # `backoff.freeFailures` failures, each further one delays the next attempt
    # by `backoff.baseSeconds`, doubling up to `backoff.maxSeconds`. During the
    # delay the verify/confirm/challenge endpoints answer 429 too-many-attempts
    # with Retry-After. It is a delay, never a lockout: the real user waits at
    # most maxSeconds even under attack, and a success clears the tally. A
    # failure older than `perAccountWindowSeconds` starts the tally afresh. Set
    # backoff.maxSeconds: 0 to disable it, e.g. when throttling at the edge.
    # PLATFORM-WIDE: set the same values on every core (a user's failures are
    # counted on their home core, so differing values would give users on
    # different cores different policies).
    attempts:
      perSession: 5
      perAccountWindowSeconds: 900
      backoff:
        freeFailures: 3
        baseSeconds: 2
        maxSeconds: 300
    # Login of an account enrolled in an MFA method that is not active on this
    # server (e.g. an SMS enrolment while methods.sms.active is false, which
    # happens when the legacy `mode` is removed without activating
    # methods.sms). By default such a login is refused with 403
    # mfa-method-inactive, and each refusal is logged as a warning. With the
    # PostgreSQL engine the boot also warns when this core holds SMS
    # enrolments while SMS is not active.
    # `true` restores the former behaviour: these accounts log in with the
    # password only, without a second factor, and a warning is logged at each
    # such login (and at boot).
    # PLATFORM-WIDE: set the same value on every core.
    allowLoginWhenMethodInactive: false

  # --- Mail delivery (welcome + reset-password) ---
  # `method` picks the transport:
  #   - 'microservice' (legacy): POST to an external service-mail over HTTP.
  #       Back-compat default — existing deployments keep working unchanged.
  #   - 'in-process': run the `mail` component inside the api-server workers.
  #       Templates live in PlatformDB (cluster-wide), SMTP creds stay local YAML.
  # `enabled.*` are independent kill-switches for each message class. When
  # both are false, mailing is off regardless of `method`.
  email:
    enabled:
      welcome: true
      resetPassword: true
      # Email verification for addresses added to an account (verification
      # link mailed to the address). Needs `auth.emailVerificationPageURL` (the
      # /verify-email page of your auth UI) and a working `services.email`
      # setup; when either is missing and this key is left at its default the
      # feature stays off and the core logs a warning at boot (it does not
      # refuse to boot). Setting this key to true EXPLICITLY makes the page URL
      # required at boot. Set false to turn the feature off silently.
      verifyEmail: true
      # Notice to the account's email when its MFA is enrolled, replaced,
      # turned off or removed with a recovery code. Best-effort: sent only when
      # mail is configured, and a delivery failure never fails the MFA call.
      mfaChange: true
    # 'in-process' is the default since the merged mail component landed in v2.
    # Deployments that still run the external pryv/service-mail microservice
    # must pin `method: microservice` in their override-config.yml.
    method: in-process
    # --- microservice mode (legacy) ---
    url: http://127.0.0.1:9000/sendmail/     # external service-mail endpoint
    key: ''                                  # shared Authorization header
    # --- shared between modes ---
    welcomeTemplate: welcome-email
    resetPasswordTemplate: reset-password
    # Sent when an email is added to an account (or resent on request). The
    # link carries a one-time token bound to (account, address); clicking it
    # marks that address verified. Requires `auth.emailVerificationPageURL`.
    verifyEmailTemplate: verify-email
    # Sent by the registration email challenge (see account.emailVerification.
    # requireAtRegistration): carries the copy/paste code, not a link.
    emailChallengeTemplate: email-challenge
    # Sent when the account's MFA changes (see enabled.mfaChange). The template
    # gets USERNAME, MFA_CHANGE (enrolled | replaced | deactivated | recovered
    # | deactivatedByAdmin) and one flag per change (MFA_ENROLLED,
    # MFA_REPLACED, MFA_DEACTIVATED, MFA_RECOVERED, MFA_DEACTIVATED_BY_ADMIN:
    # 'true' for the change that happened, '' otherwise).
    mfaChangeTemplate: mfa-change
    defaultLang: en
    # --- in-process mode only ---
    # Pug source directory seeded into PlatformDB on first boot, when PlatformDB
    # holds no templates yet. Leave empty to seed the template set bundled with
    # the mail component (components/mail/templates: welcome-email,
    # reset-password, verify-email, email-challenge, mfa-change; en + fr).
    # A deployment seeded before a template was added to that set does not get
    # it automatically: add it with `bin/mail.js templates set`. After the first
    # boot, edits go through `bin/mail.js templates set` or the admin API; a
    # later change of this key does not re-seed.
    templatesRootDir: ''
    smtp:
      host: ''
      port: 587
      secure: false
      auth:
        user: ''
        pass: ''
    from:
      name: ''
      address: ''

# === PER-CORE: debug toggle ===
testNotifications:
  enabled: false

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
updates:
  ignoreProtectedFields: false

# === PER-CORE: local pub/sub broker ===
tcpBroker:
  port: 4222

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
# `minIntervalMs` and `maxRetries` define the user-visible webhook contract.
# `runsSize` is a local buffer — PER-CORE is acceptable.
webhooks:
  minIntervalMs: 5000
  maxRetries: 5
  runsSize: 20
  # Webhook URLs must use https or http, without credentials. When a webhook
  # is called, its host is resolved and the call is refused when an address is
  # loopback, private (RFC 1918), carrier-grade NAT, link-local (incl. cloud
  # metadata), unique-local or link-local IPv6, unspecified, multicast,
  # broadcast or otherwise reserved (also as IPv4-mapped IPv6).
  # List here the receivers on a private network that may be called anyway:
  # host names (exact match), IPs or CIDR ranges, e.g.
  # ['hooks.internal.example', '10.1.2.0/24'].
  allowedPrivateHosts: []
  # A call without an answer within this delay counts as failed. Redirects are
  # not followed: a 3xx answer counts as failed too.
  requestTimeoutMs: 10000

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
versioning:
  forceKeepHistory: false
  deletionMode: 'keep-nothing'

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
user-account:
  delete: # array of entities that can delete a user account
    - 'adminToken' # enable deletion from admin Panel
    #- 'personalToken' # enable self deletion request with a personal token

# === PER-CORE: account policy ===
account:
  # Maximum number of emails an account may hold (primary included). The value
  # is clamped to a hard ceiling of 20 regardless of what is configured here.
  maxEmails: 5
  # Email-verification policy. `tokenMaxAgeMs` is how long a verification link
  # stays valid (default 24h, the user is not sitting waiting like a password
  # reset). `resendCooldownMs` is the minimum delay between two verification
  # sends for the same address (default 5min), the rate limit on
  # verification-mail spam.
  emailVerification:
    tokenMaxAgeMs: 86400000
    resendCooldownMs: 300000
    # Registration gate. When true, creating an account requires proving the
    # email address first: the client requests a one-time code
    # (POST {register}/email-challenge), the holder pastes it back
    # (POST {register}/email-challenge/verify) and the resulting proof is sent
    # with the registration. Independent of services.email.enabled.verifyEmail
    # (that flag only governs the post-creation verification mail).
    # Requires a working mail configuration: the core refuses to boot when this
    # is true and services.email is incomplete. A mail delivery failure at
    # request time blocks the registration (fail closed) rather than letting an
    # unverified account through. In a multi-core cluster set the same value on
    # every core. Admin-created accounts (system.createUser) are never gated.
    requireAtRegistration: false
    # With `microservice` or `mandrill` delivery the `email-challenge` template
    # lives on that external service, not in PlatformDB: add it there before
    # turning this on, or the first registration fails closed on a send error.
    #
    # Code policy: lifetime of a code, wrong tries before it is discarded,
    # minimum delay between two codes for the same address, codes per address
    # per day, wrong tries per address per day (across codes), and how long the
    # proof returned by a successful verification stays valid for registering.
    #
    # These budgets are keyed on the TARGET ADDRESS, because the endpoint is
    # public and has no caller identity to key on. That means someone who knows
    # an address that has no account yet can spend its daily budget and lock it
    # out of sign-up until the window rolls (and mail it a code each time). The
    # caps are deliberately soft, sized to stop bulk abuse rather than a
    # targeted nuisance; put a per-IP rate limit in front of the registration
    # endpoints at the edge if that matters to you.
    registrationCodeMaxAgeMs: 600000
    registrationCodeMaxAttempts: 5
    registrationCodeResendCooldownMs: 60000
    registrationCodeDailyLimit: 10
    registrationCodeFailuresPerDay: 20
    registrationProofMaxAgeMs: 1800000

# === PLATFORM-WIDE schema (CRITICAL — drift corrupts user account data) ===
# `custom.systemStreams` defines the account-field schema. All cores MUST agree.
# Targeted for PlatformDB migration in a future release.
# `custom.dataStores` lists code plugins — must be identical because the code is identical.
custom:
  systemStreams:
    account:
    - id: email
      isIndexed: true
      isUnique: true
      isShown: true
      isEditable: true
      type: email/string
      name: Email
      isRequiredInValidation: true
  dataStores: []

# === PER-CORE: local cache toggle ===
caching:
  isActive: true
  # Max age (seconds) of cached accesses, streams and username lookups. Bounds
  # how long a worker that missed an invalidation keeps using a deleted or
  # changed access. Costs about one storage read per user per worker per period.
  accessMaxAgeSeconds: 60

# === PER-CORE: local logs ===
logs:
  console:
    active: false
    level: info
  file:
    active: false
    path: "var-pryv/logs/core.log"
    level: info
    rotation:
      isActive: true
      days: 14
  # Loss-proof trail. `file` above buffers through an async stream, so
  # entries pending at process.exit() are lost — this one appends
  # synchronously and always lands. Costs an fs call per entry: keep it
  # at a low-volume level (warn/error), never info.
  fileSync:
    active: false
    path: "var-pryv/logs/core-sync.log"
    level: warn

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
uploads:
  maxSizeMb: 50

# === PER-CORE: local tracing toggle ===
trace:
  enable: false

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
# Integrity algorithm drift would break cross-core validation.
integrity:
  isActive:
    attachments: true
    events: true
    accesses: true
  algorithm: sha256

# === PLATFORM-WIDE policy (YAML-only in v2, post-v2 move targeted) ===
accessTracking:
  isActive: true

# === PER-CORE: this node's identity ===
# --- Core identity (multi-core) ---
# Single-core: only core.id needed (default 'single').
# Multi-core: each core has its own id; FQDN = {core.id}.{dns.domain}
core:
  id: single            # core identifier; FQDN = {id}.{dns.domain}
  ip: null              # A record for this core (null = no DNS record)
  ipv6: null            # AAAA record
  cname: null            # CNAME record (used if no ip/ipv6)
  hosting: null          # hosting key this core belongs to (null = default)
  available: true        # false = not accepting new registrations
  nonVoter: false        # true = join Raft as a non-voting (read-only) core:
                         # replicates the platform DB + forwards writes to the
                         # leader, but never counts toward quorum. Recommended
                         # for the extra cores of a 2-core deployment; promote
                         # to voter only at >=3 cores (see SINGLE-TO-MULTIPLE.md)

# === MIXED ===
# `dns.domain` is BOOTSTRAP → PLATFORM-WIDE (seeded from YAML, PlatformDB authoritative after first boot — targeted for v2).
# `dns.active`/`dns.port`/`dns.ip`/`dns.ip6`/`dns.defaultTTL`: PER-CORE (each node decides whether it runs an authoritative DNS server).
# `dns.staticEntries` and `dns.records.root.*`: PER-CORE today; a future release may move `staticEntries` to PlatformDB so runtime records replicate.
dns:
  domain: null           # primary domain (e.g. pryv.me); null = dnsLess mode
  active: false          # start DNS server (default off)
  port: 5353             # UDP and TCP port (5353 for dev, 53 in production, e.g. via Docker mapping)
  ip: '0.0.0.0'         # bind address (UDP and TCP)
  ip6: null              # IPv6 bind address, UDP and TCP (null = disabled)
  publicIp: null         # host's public IPv4 (single-core dns-active boot only).
                         # When set + dns.active + dns.domain, master.js seeds the
                         # apex SOA + NS into dns.records.root in-memory and writes
                         # `A core.<domain> -> publicIp` via PlatformDB on first
                         # boot. Operator-edited records under dns.records.root /
                         # dns.staticEntries / bin/dns-records.js always win.
                         # Unset + dns.active=true logs FATAL and skips ACME start
                         # (avoids burning the LE rate limit on a guaranteed fail).
  defaultTTL: 300        # TTL in seconds
  staticEntries: {}      # subdomain → { cname: "..." } or { a: [...] } or { txt: [...] }
  # Notes on staticEntries:
  #  - `reg`, `access`, `mfa` are reserved by the distribution — every core
  #    answers those routes directly, so the embedded DNS resolves them to
  #    all available cores' IPs automatically. You do not need to list them
  #    here (any entry is ignored in favour of the auto-resolution).
  #  - Common operator-owned entries to add when present in your deployment:
  #      sw:   { a: ['<core-ip-1>', '<core-ip-2>'] }    # static web / auth UI
  #      mail: { a: ['<core-ip-1>', '<core-ip-2>'] }    # outbound mail target
  #  - Entries here are authoritative — they shadow runtime records set
  #    by the ACME orchestrator or admin API (see drift warning log).
  records:               # root domain records
    root:
      a: []
      aaaa: []
      ns: []
      mx: []
      txt: []
      caa: []
      soa: null

# === MIXED ===
# The NAME SET is PLATFORM-WIDE: every core lists the same names; the embedded DNS answers a
# name with the cores that advertise it, and registration refuses it as a username on every core.
# `static` paths are PER-CORE (each host's filesystem); `proxy` URLs, `headers` and
# `frameAncestors` are PLATFORM-WIDE by intent (keep them identical on every core, YAML-only).
# --- Hosted sites (static folder or fixed proxy on a reserved name) ---
# DNS topology (dns.domain set, dnsLess off): served on <name>.<dns.domain>, its own origin.
# dnsLess: served under <publicUrl>/<name>/ (same origin as the API; build bundles with that base).
# A core refuses to boot when a static folder has no index.html or when a user holds a site name.
# Every site answer refuses to be framed (`Content-Security-Policy: frame-ancestors 'none'` +
# `X-Frame-Options: DENY`, against clickjacking); `frameAncestors` lists who may frame it instead.
hostedSites: {}
#  account:
#    static: /srv/pryv/sites/account         # absolute folder holding index.html (404.html optional)
#  docs:
#    proxy: https://example.github.io/docs/  # fixed upstream; the request path and query are appended
#    headers:                                 # optional, added to every response of this site
#      content-security-policy: "default-src 'self'"   # sent as a second policy, cannot relax framing
#    frameAncestors: ["'self'", "https://app.example.com"]  # optional CSP sources allowed to frame the
#                                             # site (X-Frame-Options: SAMEORIGIN for ["'self'"] alone,
#                                             # omitted for any other list; keywords quoted,
#                                             # 'none' only alone; x-frame-options not in headers)
#    hsts: auto                               # optional, when answers carry Strict-Transport-Security:
#                                             # auto (default) only when this core terminates TLS,
#                                             # always when a proxy in front terminates TLS and the
#                                             # site is HTTPS-only, never

# === PLATFORM-WIDE (targeted for PlatformDB migration before v2) ===
# --- Hostings (regions/zones/providers) ---
# Structure matches legacy /reg/hostings response for backward compatibility.
# In single-core mode, a default hosting is auto-generated.
# Availability bits (`available`, `availableCore`) already live in PlatformDB;
# a future release should move the hierarchy itself there too.
hostings: null           # null = auto-generate; or { regions: { ... } }

# === PER-CORE: process tuning + bootstrap CLI paths ===
# `ca` and `tokens` paths are only used by the bootstrap CLI (and the matching
# ack endpoint on the issuing core) — see bin/bootstrap.js. Single-core and
# DNSless multi-core deployments can ignore them.
cluster:
  apiWorkers: 2
  hfsWorkers: 1
  previewsWorker: true
  ca:
    path: /etc/pryv/ca                            # cluster CA private key + cert (back this up!)
  tokens:
    path: /var/lib/pryv/bootstrap-tokens.json     # one-time join-token store
  # A TLS certificate whose validity window does not contain the local clock
  # (with this tolerance on notBefore) is not materialized from PlatformDB nor
  # hot-swapped into the workers, and is reported at boot. 0 disables.
  # The join check of `bin/master.js --bootstrap` runs before this config is
  # loaded: it takes `--bootstrap-clock-skew-seconds` (same default) instead.
  # Clock synchronization itself (chronyd / ntpd) stays the host's job.
  clockSkewSeconds: 30
  # Core URLs (`core.url`, the URL a core advertises to its peers) receive the
  # admin key on core-to-core calls, so they must be https origins. true also
  # accepts http: for local development and test clusters only.
  allowInsecurePeerUrl: false

# === PLATFORM-WIDE ===
# `piiMode` decides whether PlatformDB stores PII as HMAC-SHA-256 tokens
# derived from `piiHmacKey` ("hashed", default since 2.0.0-rc.3) or as
# cleartext ("cleartext", opt-out for legacy single-region deployments).
# In a multi-region cluster, rqlite Raft replicates every PlatformDB row
# to every core, so plaintext usernames + isUnique-field values (default:
# email) would cross every jurisdiction without hashed mode — opaque,
# deterministic tokens still answer equality lookups but the cleartext
# never leaves the user's home core.
#
# `piiHmacKey` is operator-sync responsibility — same shape as
# `auth.adminAccessKey`: must be IDENTICAL across every core in the
# cluster, pasted into each override-config.yml. The wizard (`bin/init.js`)
# generates a fresh pepper for new installs; multi-core operators sync it
# via the bootstrap bundle (v3+).
# Manual generation:
#   `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`
# Losing the key strands every hashed row (no way to re-derive without
# both the plaintext + the pepper) — back it up alongside the cluster CA.
#
# Upgrading from a cleartext deployment: run `bin/platform-pii-migrate.js
# up` to rehash existing PlatformDB rows before the new code boots, OR
# explicitly opt out by setting `platform.piiMode: cleartext` in
# override-config.yml.
#
# Hashing is pseudonymisation (EDPB / WP29 Opinion 05/2014), NOT
# anonymisation. Cross-border replication of HMAC'd PII still needs an
# Art.46 mechanism (SCCs / BCRs); what hashed mode achieves is the
# defence-in-depth + Art.32(1)(a) pseudonymisation evidence.
platform:
  piiMode: hashed                                 # hashed (default since 2.0.0-rc.3) | cleartext (legacy opt-out)
  piiHmacKey: ''                                  # base64 of 32 random bytes; REQUIRED when piiMode=hashed (wizard generates)
  # piiAlgorithm is a CLUSTER-WIDE choice (every core must agree), NOT a
  # per-token attribute — tokens are stored bare (no scheme prefix). Today
  # the only value is hmac-sha256. To upgrade later (e.g. a slow KDF that
  # hardens the low-entropy input domain against brute force): add the new
  # algorithm, run a coordinated re-derive-from-plaintext migration (the
  # same bin/platform-pii-rotate.js tooling that swaps the pepper), then
  # flip this key on every core. A new algorithm changes every digest, so
  # the migration is all-at-once — which is why no per-token scheme tag is
  # needed.
  piiAlgorithm: hmac-sha256                       # cluster-wide; only hmac-sha256 today

# === MIXED ===
# `enabled` + `email` + `atRestKey` are PLATFORM-WIDE (every core must agree);
# `certRenewer` + `tlsDir` + `onRotateScript` are PER-CORE.
# `atRestKey` is operator-sync responsibility — same shape as `auth.adminAccessKey`:
# must be identical across every core, pasted into each override-config.yml.
# Generate with `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`.
#
# Hostnames + challenge type (http-01 / dns-01) are DERIVED from the topology
# (dnsLess.publicUrl / core.url / dns.domain) — there is intentionally no
# `letsEncrypt.hostnames` field so the two can't drift.
letsEncrypt:
  enabled: false                                  # feature off by default — existing deployments unchanged
  email: null                                     # optional ACME account contact (Let's Encrypt no longer sends expiry emails)
  atRestKey: 'REPLACE ME'                         # base64 of 32 random bytes; encrypts cert + account keys at rest in rqlite
  renewBeforeDays: 30
  staging: false                                  # use Let's Encrypt staging (testing only)
  tlsDir: var-pryv/tls                            # per-hostname dirs live under this root
  certRenewer: false                              # set true on exactly ONE core — typically the cluster CA holder
  onRotateScript: null                            # optional absolute path; invoked after every successful rotation on this core
  directoryUrl: null                              # override to point at Pebble or an internal ACME for testing

# === OBSERVABILITY (optional APM) ===
# Opt-in. When disabled, no provider module is loaded and the façade is a no-op.
# Secrets live in PlatformDB (cluster-wide, AES-256-GCM encrypted via the same
# `AtRestEncryption` module letsEncrypt uses). The CLI `bin/observability.js`
# is the operator-facing way to manage them without editing YAML on every core.
#
# Effective-value rule: if `observability.enabled: false` is set LOCALLY in
# override-config.yml, the local value wins over PlatformDB. This lets an
# operator yank a misbehaving agent without touching cluster state.
observability:
  # `enabled`, `appName`: default unset — PlatformDB is authoritative.
  # Operators who need an emergency local kill-switch can set
  # `observability.enabled: false` in override-config.yml; that always wins
  # over PlatformDB. Conversely, setting `enabled: true` locally is a no-op
  # unless an OTLP endpoint is configured.
  #
  # Telemetry is built from a fixed allow-list (per-method call counts,
  # durations, error counts and sanitized stack traces) and shipped over
  # OTLP/HTTP, so any OTLP-ingesting backend works — including a collector
  # you run yourself, which keeps telemetry inside your trust boundary.
  otlp:
    endpoint: ''                                  # if set locally, wins over PlatformDB (emergency override)
    # headers: { api-key: '' }                    # auth header the backend expects; prefer bin/observability.js set-header (encrypted at rest)
    # flushIntervalSeconds: 300                   # 60-3600. PRIVACY control: error reports are grouped per interval and
    #                                             # stamped at its boundary, so a longer interval reduces the chance that a
    #                                             # single report on a low-traffic instance correlates to a single user.

# === PER-CORE: schema migrations ===
# Engine-agnostic schema migration runner (see storages/interfaces/migrations/).
# When true, master.js applies pending migrations against each migration-capable
# engine before forking workers. Set false to operate migrations manually via
# `node bin/migrate.js`.
migrations:
  autoRunOnStart: true

# === MIXED ===
# `audit.active` is PLATFORM-WIDE policy; `audit.storage`/`audit.syslog` contain per-core sinks.
# --- Audit ---
audit:
  active: true
  # End-state of audit_logs when `auth.delete` runs.
  #   erase (default)  — auditStorage.deleteUser(userId) wipes the user's
  #                      audit rows. GDPR Art.17 / CCPA §1798.105 default.
  #   keep             — skip audit erasure. For HIPAA §164.316(b)(2)(i)
  #                      6-year retention, MDR Art.10(8) 10-year retention,
  #                      or any regime keeping the audit under a separate
  #                      lawful basis (GDPR Art.17(3)(b)). Operator must
  #                      document the retention in their DPIA.
  #   pseudonymise     — null/hash personal identifiers, keep the access
  #                      pattern + timestamps. Requires the auth.randomAlias
  #                      primitive (open-pryv.io#38). REFUSED AT BOOT until
  #                      ALIASES ships — operators selecting this mode get
  #                      a clear failure rather than a silent fallback.
  onUserDelete: erase
  storage:
    filter:
      methods:
        include: ['all']
        exclude: []

  syslog:
    # Opt-in: containerized deploys typically have no syslog daemon listening
    # on /dev/log. Operators on bare-metal hosts with rsyslog/journald who
    # want the host-syslog mirror set this to `true` in override-config.yml.
    # The per-user audit storage (audit.storage) is unaffected by this flag.
    active: false
    options:
      host: localhost
      #port: 514
      protocol: unix
      #path: /dev/log # set by config/default-path.js
      localhost: ''
      app_name: pryv-audit

    formats:
      default:
        template: "{userid} {type} createdBy:{createdBy} {streamIds} {content}"
        level: notice
    filter:
      methods:
        include: ['all']
        exclude: []


# --- OAuth 2.0 authorization server ---
# Configures the /oauth2/authorize + /oauth2/token endpoints and
# /.well-known/oauth-authorization-server discovery doc.
# clientRegistration.mode = "curated" is the only supported value;
# operator-only app-account promotion via bin/oauth-client.js. The
# RFC 7591 dynamic-registration HTTP endpoint is intentionally not
# shipped; config validation rejects mode: open.
oauth:
  accessTokenTTL: 3600             # seconds (1 hour default)
  refreshTokenTTL: 2592000         # seconds (30 days sliding)
  refreshTokenAbsoluteTTL: 7776000 # seconds (90 days absolute cap)
  # Refresh-token reuse detection: replaying an already-rotated token within this
  # window of its rotation is treated as a benign double-submit (no chain revoke);
  # a replay past it revokes the whole chain. Keep small — real client retries are
  # sub-second. 0 = strict (any replay revokes).
  refreshReuseGraceSeconds: 10     # seconds
  # DPoP (RFC 9449) sender-constrained tokens: acceptance window for a
  # proof's iat around server time. The feature itself needs no enable
  # flag — it is inert unless a client sends a DPoP header.
  #
  # ⚠️ DEPLOYMENT REQUIREMENT: a DPoP proof binds to the CLIENT-FACING
  # request URI (method + scheme + host + path). The server reconstructs
  # that URI from the X-Forwarded-Host / X-Forwarded-Proto headers when the
  # request comes from a proxy listed in http.trustedProxies, and from the
  # connection's own host/proto otherwise (so a client reaching the core
  # directly cannot pick the host its proof is checked against). Behind a
  # proxy, list it in http.trustedProxies (loopback, the default, covers a
  # proxy on the same host) and make it OVERWRITE these headers with the
  # true client-facing values: a proxy that omits X-Forwarded-Proto on a
  # TLS-terminated connection makes every proof's https scheme mismatch
  # (legitimate clients get 403).
  dpop:
    clockSkewSeconds: 120          # seconds (± around now)
    # Operator revoke-by-key propagation: `bin/oauth-client.js revoke-key <jkt>`
    # writes a cluster-wide (PlatformDB) tombstone; each core caches the revoked
    # thumbprint set for this many seconds, so a revoke reaches LIVE DPoP-bound
    # tokens within this window (read locally, no cross-core bus). Lower = faster
    # revoke, more PlatformDB reads.
    keyRevokeCheckSeconds: 30      # seconds
  # Operator client-revoke propagation: `bin/oauth-client.js revoke <id>` writes
  # a cluster-wide (PlatformDB) tombstone; each core caches the revoked-client
  # set for this many seconds, so a revoke reaches LIVE access tokens
  # cluster-wide within this window (vs waiting out the access-token TTL). Lower
  # = faster revoke, more PlatformDB reads.
  clientRevokeCheckSeconds: 30     # seconds
  clientRegistration:
    mode: curated                  # ONLY supported value; "open" is rejected
  requireAppAccountMfa: true       # app accounts must enrol MFA before /oauth2/* writes
  audAllowList: []                 # optional list of accepted aud values on /oauth2/authorize
  grantTypesSupported:             # advertised in the discovery doc
    - authorization_code

# Shared secrets — hand a secret to a third party by one-time key instead of
# by URL query parameter. Inert unless a client calls it: no listener, no
# background work, so it is on by default and existing deployments see no
# change until something uses it.
sharedSecrets:
  enabled: true
  maxSizeBytes: 4096               # cap on the serialized `secret` payload
  maxTtl: 2592000                  # seconds (30 days); `ttl` is mandatory, no default

# Account delegation — reserved stream-id namespace owner + guard hooks that
# protect the delegation namespace and its managed accesses/events. Inert
# unless the plugin writes the namespace; the guards only reject user attempts
# to reach it, so it is on by default. Set `active: false` to disable the
# guard wiring entirely.
delegation:
  active: true
